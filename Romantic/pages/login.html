<!-- pages/login.html -->
<!DOCTYPE html>
<!--
  Arquivo: pages/login.html
  Dono: Unidade 1 (Autenticação)
  
  Contrato / Requisitos:
  - Tela pública de login.
  - Formulário com e-mail e senha com labels semânticos (WCAG 2.1 AA).
  - Invoca async Auth.login(email, senha).
  - Trata erros e RegraViolada com feedback visual.
  - Redireciona para dashboard.html se tiver casal, ou vinculo.html se pendente.
  - Inclui atalho de acesso rápido de demonstração (Casal Demo) para testes práticos.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Romantic</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Base -->
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Cabeçalho Simples de Login -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2 text-decoration-none" href="../index.html" style="color: #E91E63 !important;">
        <i class="bi-heart-fill"></i> Romantic
      </a>
      <a href="../index.html" class="text-secondary text-decoration-none small">
        <i class="bi-arrow-left me-1"></i> Início
      </a>
    </div>
  </header>

  <main id="app-main" class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    
    <div class="card card-romantic p-4 p-md-5 w-100" style="max-width: 440px;">
      
      <div class="text-center mb-4">
        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-2" 
             style="width: 60px; height: 60px; background-color: #FCE4EC; color: #E91E63; font-size: 1.8rem;" 
             aria-hidden="true">
          <i class="bi-person-heart"></i>
        </div>
        <h1 class="h3 fw-bold text-dark mb-1">Bem-vindo(a) de volta</h1>
        <p class="text-secondary small mb-0">Entre para continuar escolhendo momentos a dois</p>
      </div>

      <!-- Container de Alertas -->
      <div id="alerta-login" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert"></div>

      <!-- Formulário de Login -->
      <form id="form-login" novalidate>
        
        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-secondary">E-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-envelope"></i></span>
            <input type="email" 
                   class="form-control border-start-0" 
                   id="email" 
                   name="email" 
                   placeholder="seu.email@exemplo.com" 
                   required 
                   autocomplete="email">
          </div>
        </div>

        <div class="mb-4">
          <label for="senha" class="form-label small fw-semibold text-secondary">Senha</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-lock"></i></span>
            <input type="password" 
                   class="form-control border-start-0" 
                   id="senha" 
                   name="senha" 
                   placeholder="Sua senha secreta" 
                   required 
                   autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn btn-romantic w-100 py-2 mb-3 fw-semibold" id="btn-entrar">
          <i class="bi-box-arrow-in-right me-1" aria-hidden="true"></i> Entrar
        </button>

      </form>

      <!-- Botão de Demonstração / Atalho para Testes -->
      <div class="border-top pt-3 text-center">
        <p class="text-muted small mb-2">Para testar o MVP rapidamente:</p>
        <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-3" id="btn-demo-casal">
          <i class="bi-stars text-warning me-1"></i> Entrar com Casal Demo (Arthur & Sofia)
        </button>

        <p class="small text-secondary mb-0">
          Ainda não tem conta? <a href="cadastro.html" class="fw-semibold text-danger text-decoration-none">Cadastre-se</a>
        </p>
      </div>

    </div>

  </main>

  <footer class="py-3 bg-white border-top text-center text-muted small">
    <div class="container">
      <p class="mb-1"><strong>Romantic</strong> — Para continuar escolhendo depois do match.</p>
      <p class="mb-0 text-secondary">Apoiando o ODS 3 (Saúde e Bem-Estar) e ODS 5 (Igualdade de Gênero).</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/casal.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Se já estiver logado, redireciona ao dashboard
      if (typeof Auth !== 'undefined' && Auth.usuarioAtual && Auth.usuarioAtual()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('form-login');
      const alerta = document.getElementById('alerta-login');
      const btnEntrar = document.getElementById('btn-entrar');
      const btnDemo = document.getElementById('btn-demo-casal');

      function exibirErro(msg) {
        alerta.textContent = msg;
        alerta.classList.remove('d-none');
      }

      // Submissão do formulário de Login
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alerta.classList.add('d-none');

        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value;

        if (!email || !senha) {
          exibirErro('Por favor, preencha o e-mail e a senha.');
          return;
        }

        btnEntrar.disabled = true;
        btnEntrar.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Entrando...';

        try {
          // Aplica RN01 e RNF04
          const usuario = await Auth.login(email, senha);

          // Verifica se possui casal vinculado
          let temCasal = false;
          if (typeof Casal !== 'undefined' && typeof Casal.casalAtual === 'function') {
            temCasal = !!Casal.casalAtual();
          } else {
            temCasal = !!usuario.casalId;
          }

          if (temCasal) {
            window.location.href = 'dashboard.html';
          } else {
            window.location.href = 'vinculo.html';
          }
        } catch (erro) {
          btnEntrar.disabled = false;
          btnEntrar.innerHTML = '<i class="bi-box-arrow-in-right me-1" aria-hidden="true"></i> Entrar';
          exibirErro(erro.mensagem || erro.message || 'Falha ao autenticar.');
        }
      });

      // Botão de Atalho para Casal Demo
      btnDemo.addEventListener('click', () => {
        const estado = Store.ler();
        
        let usr1 = estado.usuarios.find(u => u.email === 'arthur@teste.com');
        let usr2 = estado.usuarios.find(u => u.email === 'sofia@teste.com');

        if (!usr1) {
          usr1 = {
            id: 'demo-usr-1',
            nome: 'Arthur Silva',
            email: 'arthur@teste.com',
            senhaHash: 'demo',
            dataNascimento: '2001-05-12',
            casalId: 'demo-casal-1',
            criadoEm: new Date().toISOString()
          };
          estado.usuarios.push(usr1);
        }

        if (!usr2) {
          usr2 = {
            id: 'demo-usr-2',
            nome: 'Sofia Souza',
            email: 'sofia@teste.com',
            senhaHash: 'demo',
            dataNascimento: '2002-08-20',
            casalId: 'demo-casal-1',
            criadoEm: new Date().toISOString()
          };
          estado.usuarios.push(usr2);
        }

        let casal = estado.casais.find(c => c.id === 'demo-casal-1');
        if (!casal) {
          casal = {
            id: 'demo-casal-1',
            usuarioIds: ['demo-usr-1', 'demo-usr-2'],
            apelido: 'Arthur & Sofia',
            criadoEm: new Date().toISOString()
          };
          estado.casais.push(casal);
        }

        usr1.casalId = 'demo-casal-1';
        usr2.casalId = 'demo-casal-1';
        estado.sessao = { usuarioId: usr1.id };

        Store.salvar(estado);
        window.location.href = 'dashboard.html';
      });

    });
  </script>
</body>
</html>
