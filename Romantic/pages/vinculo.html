<!DOCTYPE html>
<!--
  Arquivo: pages/vinculo.html
  Dono: Unidade 1 (Casal / Vínculo)
  Contrato / Propósito:
  - Tela restrita (RN01) de conexão do casal.
  - Permite convidar o parceiro por e-mail (Casal.convidar), visualizar e responder convites recebidos (Casal.aceitarConvite / Casal.recusarConvite).
  - Garante RN02 (1 casal por usuário) e RN08 (proibido auto-convite ou convidar usuário já em casal).
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vínculo do Casal — Romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <main id="app-main" class="container py-4 flex-grow-1">
    <!-- Gerenciador de convites e vínculo será implementado na Unidade 1 -->
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/casal.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Auth !== 'undefined' && typeof Auth.exigirLogin === 'function') {
        Auth.exigirLogin('login.html');
      }
      if (typeof Layout !== 'undefined' && typeof Layout.montar === 'function') {
        Layout.montar({ paginaAtiva: 'vinculo' });
      }
    });
  </script>
</body>
</html>
