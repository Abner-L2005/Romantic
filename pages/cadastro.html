<!-- pages/cadastro.html -->
<!DOCTYPE html>
<!--
  Arquivo: pages/cadastro.html
  Dono: Unidade 1 (Autenticação)
  
  Contrato / Requisitos:
  - Tela pública de cadastro de novos usuários.
  - Formulário com nome, e-mail único, data de nascimento e senha (min 6 caracteres).
  - Invoca async Auth.cadastrar({ nome, email, senha, dataNascimento }).
  - Cobre regras RN07 e RNF04 (SHA-256 via crypto.subtle).
  - Redireciona para vinculo.html após cadastro com sucesso.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — Romantic</title>
  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Base -->
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Cabeçalho de Cadastro -->
  <header class="py-3 bg-white border-bottom shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand fw-bold text-danger d-flex align-items-center gap-2 text-decoration-none" href="../index.html" style="color: #E91E63 !important;">
        <i class="bi-heart-fill"></i> Romantic
      </a>
      <a href="login.html" class="text-secondary text-decoration-none small">
        Já tenho conta <i class="bi-arrow-right ms-1"></i>
      </a>
    </div>
  </header>

  <main id="app-main" class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    
    <div class="card card-romantic p-4 p-md-5 w-100" style="max-width: 480px;">
      
      <div class="text-center mb-4">
        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-2" 
             style="width: 60px; height: 60px; background-color: #FCE4EC; color: #E91E63; font-size: 1.8rem;" 
             aria-hidden="true">
          <i class="bi-person-plus-fill"></i>
        </div>
        <h1 class="h3 fw-bold text-dark mb-1">Crie sua Conta</h1>
        <p class="text-secondary small mb-0">Cadastre-se para começar a escolher momentos com seu par</p>
      </div>

      <!-- Container de Alertas -->
      <div id="alerta-cadastro" class="alert alert-danger d-none py-2 px-3 small mb-3" role="alert"></div>

      <!-- Formulário de Cadastro -->
      <form id="form-cadastro" novalidate>
        
        <div class="mb-3">
          <label for="nome" class="form-label small fw-semibold text-secondary">Nome completo</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-person"></i></span>
            <input type="text" 
                   class="form-control border-start-0" 
                   id="nome" 
                   name="nome" 
                   placeholder="Ex: Arthur Silva" 
                   required 
                   autocomplete="name">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label small fw-semibold text-secondary">E-mail</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-envelope"></i></span>
            <input type="email" 
                   class="form-control border-start-0" 
                   id="email" 
                   name="email" 
                   placeholder="seu.email@exemplo.com" 
                   required 
                   autocomplete="email">
          </div>
        </div>

        <div class="mb-3">
          <label for="dataNascimento" class="form-label small fw-semibold text-secondary">Data de nascimento</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-calendar-heart"></i></span>
            <input type="date" 
                   class="form-control border-start-0" 
                   id="dataNascimento" 
                   name="dataNascimento" 
                   required>
          </div>
        </div>

        <div class="mb-4">
          <label for="senha" class="form-label small fw-semibold text-secondary">Senha (mínimo 6 caracteres)</label>
          <div class="input-group">
            <span class="input-group-text bg-white text-secondary border-end-0"><i class="bi-lock"></i></span>
            <input type="password" 
                   class="form-control border-start-0" 
                   id="senha" 
                   name="senha" 
                   placeholder="Mínimo de 6 caracteres" 
                   required 
                   minlength="6"
                   autocomplete="new-password">
          </div>
        </div>

        <button type="submit" class="btn btn-romantic w-100 py-2 mb-3 fw-semibold" id="btn-cadastrar">
          <i class="bi-check-circle me-1" aria-hidden="true"></i> Criar Minha Conta
        </button>

        <p class="text-center small text-secondary mb-0">
          Já tem conta? <a href="login.html" class="fw-semibold text-danger text-decoration-none">Entrar</a>
        </p>

      </form>

    </div>

  </main>

  <footer class="py-3 bg-white border-top text-center text-muted small">
    <div class="container">
      <p class="mb-1"><strong>Romantic</strong> — Para continuar escolhendo depois do match.</p>
      <p class="mb-0 text-secondary">Apoiando o ODS 3 (Saúde e Bem-Estar) e ODS 5 (Igualdade de Gênero).</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Se já estiver logado, redireciona ao dashboard
      if (typeof Auth !== 'undefined' && Auth.usuarioAtual && Auth.usuarioAtual()) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('form-cadastro');
      const alerta = document.getElementById('alerta-cadastro');
      const btnCadastrar = document.getElementById('btn-cadastrar');

      function exibirErro(msg) {
        alerta.textContent = msg;
        alerta.classList.remove('d-none');
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alerta.classList.add('d-none');

        const nome = document.getElementById('nome').value.trim();
        const email = document.getElementById('email').value.trim();
        const dataNascimento = document.getElementById('dataNascimento').value;
        const senha = document.getElementById('senha').value;

        if (!nome || !email || !senha) {
          exibirErro('Por favor, preencha todos os campos obrigatórios.');
          return;
        }

        btnCadastrar.disabled = true;
        btnCadastrar.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Cadastrando...';

        try {
          // Aplica RN07 e RNF04
          await Auth.cadastrar({ nome, email, senha, dataNascimento });
          window.location.href = 'vinculo.html';
        } catch (erro) {
          btnCadastrar.disabled = false;
          btnCadastrar.innerHTML = '<i class="bi-check-circle me-1" aria-hidden="true"></i> Criar Minha Conta';
          exibirErro(erro.mensagem || erro.message || 'Falha ao realizar cadastro.');
        }
      });
    });
  </script>
</body>
</html>
