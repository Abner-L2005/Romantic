<!DOCTYPE html>
<!--
  Arquivo: pages/perfil.html
  Dono: Unidade 4 (Perfil e Galeria de Memórias)
  Contrato / Propósito:
  - Perfil do usuário e do relacionamento (RN01, RN03).
  - Mostra nome dos parceiros, data do início do casal, estatísticas gerais (desafios concluídos, pontos totais).
  - Galeria de memórias fotográficas e mensagens afetivas registradas nas conclusões.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil do Casal — Romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <main id="app-main" class="container py-4 flex-grow-1">
    <!-- Dados do casal, histórico e mural de memórias serão implementados na Unidade 4 -->
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/casal.js"></script>
  <script src="../js/desafios.js"></script>
  <script src="../js/pontuacao.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Auth !== 'undefined' && typeof Auth.exigirLogin === 'function') {
        Auth.exigirLogin('login.html');
      }
      if (typeof Layout !== 'undefined' && typeof Layout.montar === 'function') {
        Layout.montar({ paginaAtiva: 'perfil' });
      }
    });
  </script>
</body>
</html>
