<!DOCTYPE html>
<!--
  Arquivo: pages/login.html
  Dono: Unidade 1 (Auth)
  Contrato / Propósito:
  - Tela pública de login.
  - Formulário com e-mail e senha.
  - Invoca async Auth.login(email, senha).
  - Redireciona para dashboard.html em caso de sucesso ou vinculo.html se ainda não possuir casal.
  - Atende WCAG 2.1 AA (labels, foco visível, aria).
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/base.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <main id="app-main" class="container py-5 flex-grow-1">
    <!-- Formulário de autenticação será implementado na Unidade 1 -->
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Layout !== 'undefined' && typeof Layout.montar === 'function') {
        Layout.montar({ paginaAtiva: 'login' });
      }
    });
  </script>
</body>
</html>
