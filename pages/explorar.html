<!DOCTYPE html>
<!--
  Arquivo: pages/explorar.html
  Dono: Unidade 2 (Catálogo de Ideias)
  Contrato / Propósito:
  - Catálogo interativo de 20 ideias de encontros e atividades.
  - Filtro por categorias ("Em casa", "Ao ar livre", "Românticas", "Divertidas", "Rápidas", "Baixo custo").
  - Campo de busca instantânea em tempo real (Ideias.listar({ categoria, busca })).
  - Cards com badges de tempo, custo, dificuldade e pontos.
  - Botão para ver detalhes (pages/ideia.html?id=...).
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Ideias — Romantic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/catalogo.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <div id="app-header"></div>

  <main id="app-main" class="container py-4 flex-grow-1">
    <!-- Filtros de categoria, campo de busca e grade de ideias serão implementados na Unidade 2 -->
  </main>

  <div id="app-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dados-ideias.js"></script>
  <script src="../js/ideias.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof Auth !== 'undefined' && typeof Auth.exigirLogin === 'function') {
        Auth.exigirLogin('login.html');
      }
      if (typeof Layout !== 'undefined' && typeof Layout.montar === 'function') {
        Layout.montar({ paginaAtiva: 'explorar' });
      }
    });
  </script>
</body>
</html>
