<!DOCTYPE html>
<!--
  Arquivo: tests/tests.html
  Dono: Unidade 4 (Suíte de Testes Automatizados)
  Contrato / Propósito:
  - Test runner no navegador para validação rigorosa de regras de negócio (RN01 a RN08) e contratos.
  - Testa Store, Auth, Casal, Ideias, Desafios, Pontuacao e Recompensas.
  - Sem frameworks externos: microframework de asserção puro (assert, describe, it).
  - Executável localmente via navegador sem necessidade de terminal ou Node.js.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suíte de Testes — Romantic</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; }
    .teste-passou { color: #198754; }
    .teste-falhou { color: #dc3545; font-weight: bold; }
    .card-resumo { border-radius: 12px; }
  </style>
</head>
<body class="container py-4">
  <header class="mb-4 pb-2 border-bottom">
    <h1 class="h3">Suíte de Testes Automatizados — Romantic</h1>
    <p class="text-muted mb-0">Validação canônica de regras de negócio (RN01 a RN08) e contratos dos módulos de domínio.</p>
  </header>

  <div id="test-summary" class="alert alert-secondary mb-4">
    Iniciando execução da suíte de testes...
  </div>

  <div id="test-results" class="list-group shadow-sm">
    <!-- Resultados dos testes serão renderizados aqui na Unidade 4 -->
  </div>

  <!-- Scripts de Produção -->
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/casal.js"></script>
  <script src="../js/dados-ideias.js"></script>
  <script src="../js/ideias.js"></script>
  <script src="../js/desafios.js"></script>
  <script src="../js/pontuacao.js"></script>
  <script src="../js/recompensas.js"></script>

  <!-- Script Runner de Testes -->
  <script>
    // Micro-runner de testes será expandido na Unidade 4
    const TestRunner = {
      testes: [],
      passaram: 0,
      falharam: 0,

      registrar(nome, fn) {
        this.testes.push({ nome, fn });
      },

      async executar() {
        const resultsEl = document.getElementById('test-results');
        const summaryEl = document.getElementById('test-summary');
        resultsEl.innerHTML = '';

        for (const t of this.testes) {
          try {
            await t.fn();
            this.passaram++;
            resultsEl.innerHTML += `<div class="list-group-item list-group-item-action teste-passou">✔ ${t.nome}</div>`;
          } catch (e) {
            this.falharam++;
            resultsEl.innerHTML += `<div class="list-group-item list-group-item-action list-group-item-danger teste-falhou">✖ ${t.nome}: ${e.message}</div>`;
          }
        }

        const total = this.passaram + this.falharam;
        summaryEl.className = this.falharam === 0 ? 'alert alert-success mb-4' : 'alert alert-danger mb-4';
        summaryEl.innerHTML = `<strong>Total:</strong> ${total} testes | <strong>Passaram:</strong> ${this.passaram} | <strong>Falharam:</strong> ${this.falharam}`;
      }
    };

    // Teste de integridade do módulo Store
    TestRunner.registrar('Store: deve inicializar e salvar estado padrão no storage', () => {
      const estado = window.Store.resetar();
      if (!Array.isArray(estado.usuarios) || !Array.isArray(estado.desafios)) {
        throw new Error('Estado padrão não contém arrays requeridos');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      TestRunner.executar();
    });
  </script>
</body>
</html>
